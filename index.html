<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Habits</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaed; --muted:#8b93a1; --accent:#34d399; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h2 { font-size: 1rem; color: var(--muted); font-weight: 600; margin: 24px 0 8px; }

  nav { position: fixed; inset: auto 0 0 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; padding: 14px 0; color: var(--muted); font-weight: 600; }
  nav button.on { color: var(--accent); }

  .day { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day > button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 1.6rem; line-height: 1; }
  .day > button:disabled { opacity: .3; }
  .day .date { text-align: center; font-weight: 700; font-size: 1.15rem; }
  .day .score { text-align: center; color: var(--accent); font-weight: 700; font-size: 1.6rem; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .list.paused { opacity: .4; }
  .habit { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .habit .box { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; color: var(--bg); }
  .habit.done .box { background: var(--accent); border-color: var(--accent); }
  .habit.done .name { color: var(--muted); }
  .habit.met:not(.done) { opacity: .55; }
  .txt { display: flex; flex-direction: column; }
  .note { font-size: .85rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  .ghost, .btn { margin-top: 16px; width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--muted); }
  .btn { border-style: solid; background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  .banner { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--warn); background: none; color: var(--warn); text-align: left; }

  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .heat b { font-size: .7rem; color: var(--muted); font-weight: 500; display: grid; place-items: center; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: rgb(52 211 153 / calc(.08 + var(--r, 0) * .92)); }
  .cell.future { background: none; }
  .cell.pause { background: repeating-linear-gradient(45deg, #2a2e37 0 3px, #1c1f26 3px 6px); }
  .cell.today { outline: 2px solid var(--text); outline-offset: 1px; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  td:first-child, th:first-child { text-align: left; white-space: normal; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }

  .row { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row .txt { flex: 1; min-width: 0; }
  .row button { min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 10px; }
  .row button:disabled { opacity: .3; }
  form { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  form .btns { display: flex; gap: 8px; }
  form .btns .btn { margin: 0; }
  .muted { color: var(--muted); font-size: .85rem; }

  /* check mark + completion */
  .habit .box svg { width: 18px; height: 18px; fill: none; stroke: var(--bg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .day .sub { text-align: center; font-size: .8rem; color: var(--muted); min-height: 1.1em; }
  .score.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.25); text-shadow: 0 0 18px rgb(52 211 153 / .7); } 100% { transform: scale(1); } }
  .tag { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }

  /* banners */
  .banner.info { display: flex; align-items: center; gap: 8px; border-color: var(--line); background: var(--card); color: var(--text); }
  .banner.info span { flex: 1; }
  .banner.info button { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 6px; }
  .banner.info button.x { color: var(--muted); font-size: 1.2rem; line-height: 1; }

  /* not scheduled today */
  details.more { margin-top: 16px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 6px 2px; list-style: none; }
  details.more summary::before { content: '▸ '; }
  details.more[open] summary::before { content: '▾ '; }
  details.more .habit { min-height: 50px; opacity: .8; }

  /* form: weekday chips */
  .days { display: none; gap: 6px; }
  form[data-kind=days] .days { display: flex; }
  .chip { flex: 1; display: block; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; text-align: center; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 600; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip input:focus-visible + span { outline: 2px solid var(--text); }

  /* stats */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 0; border-radius: 9px; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--line); color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card b { display: block; font-size: 1.4rem; }
  .card span { font-size: .75rem; color: var(--muted); }
  .mx-wrap { overflow-x: auto; scrollbar-width: thin; }
  .mx { border-collapse: collapse; width: auto; }
  .mx td, .mx th { padding: 1.5px; border: 0; text-align: center; } /* padding, not border-spacing: no gaps for scrolled cells to show through */
  .mx .nm { position: sticky; left: 0; z-index: 1; background: var(--bg); text-align: left; font-weight: 500; font-size: .85rem;
    max-width: 110px; min-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; box-shadow: -4px 0 0 var(--bg); }
  .dh { border: 0; background: none; color: var(--muted); font-size: .7rem; line-height: 1.2; padding: 2px 0; width: 22px; }
  .dh span { display: block; font-size: .6rem; }
  .dh.we { color: #a3abb8; }
  .dh.today { color: var(--text); font-weight: 700; }
  .c { display: block; width: 22px; height: 22px; border-radius: 5px; }
  .c.done { background: var(--accent); }
  .c.missed { background: rgb(248 113 113 / .18); box-shadow: inset 0 0 0 1.5px rgb(248 113 113 / .75); }
  .c.pending { box-shadow: inset 0 0 0 1.5px var(--muted); }
  .c.off { background: radial-gradient(circle, #2a2e37 2px, transparent 2.5px); }
  .c.bonus { background: radial-gradient(circle, var(--accent) 4px, transparent 4.5px); box-shadow: inset 0 0 0 1.5px rgb(52 211 153 / .4); }
  .c.paused { background: repeating-linear-gradient(45deg, #2a2e37 0 3px, #1c1f26 3px 6px); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .75rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 5px; border-radius: 3px; }
  .legend .c { width: 12px; height: 12px; }
  td.weak { color: #f87171; }
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-tab="today">Today</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="settings">Settings</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="logic.js"></script>
<script>
const L = HabitLogic;
const KEY = 'habits-v1';
const today = () => L.dayKey(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let data = load();
let tab = 'today';
let viewDay = today();
let lastToday = viewDay;
let editing = null; // null | 'new' | habit id
let persisted = null;
let range = 30;         // stats range in days
let celebrate = false;  // play the "all done" animation on next render
// per-device UI state (not synced): which yesterday was already reviewed
const UI_KEY = 'habits-ui';
const ui = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
const saveUi = () => localStorage.setItem(UI_KEY, JSON.stringify(ui));
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const STATUS = { done: 'done', missed: 'missed', pending: 'not done yet', off: 'not scheduled', bonus: 'done (bonus)', paused: 'paused', none: '' };

function load() {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    try { const d = JSON.parse(raw); if (L.validate(d)) return d; } catch (e) {}
    // never overwrite unreadable data: keep a copy aside
    localStorage.setItem(KEY + '-corrupt-' + Date.now(), raw);
    alert('Saved data could not be read. A copy was kept. Starting fresh — import a backup in Settings.');
  }
  const d = L.defaultData(today());
  localStorage.setItem(KEY, JSON.stringify(d));
  return d;
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { alert('Could not save: ' + e.message + '. Export a backup now.'); }
}
function save() { persist(); scheduleSync(); }
// re-render, but never wipe a half-filled habit form
const safeRender = () => { if (!editing) render(); };

// ---- Sync between devices via a private GitHub gist ----
const SYNC_KEY = 'habits-sync'; // { token, gistId } — kept apart from data so it never lands in an export
const FILE = 'habits-data.json';
let sync = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
let syncStatus = '';
let syncTimer = null, syncing = null, again = false;

async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opts, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (!r.ok) throw new Error(r.status === 401 ? 'token invalid or expired' : r.status === 403 || r.status === 404 ? 'no access — token needs Gists: Read and write' : 'GitHub error ' + r.status);
  return r.json();
}
async function pullRemote() {
  const f = (await gh('/gists/' + sync.gistId)).files[FILE];
  if (!f) throw new Error('data file missing in gist');
  const obj = JSON.parse(f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content);
  if (!L.validate(obj)) throw new Error('cloud data is not valid');
  return obj;
}
const pushRemote = d => gh('/gists/' + sync.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(d) } } }) });
const clock = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

function scheduleSync() {
  if (!sync) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
// pull -> merge -> push if cloud is behind. Failures keep local data; next sync retries.
// ponytail: no locking — if both devices push within the same second, one write can be lost from the gist,
// but that device still has it locally and re-pushes it on its next sync. Add ETag checks if that ever bites.
function syncNow() {
  clearTimeout(syncTimer); syncTimer = null;
  if (!sync) return Promise.resolve();
  if (syncing) { again = true; return syncing; }
  syncing = (async () => {
    try {
      const remote = await pullRemote();
      const merged = L.merge(data, remote);
      const s = JSON.stringify(merged);
      const localChanged = s !== JSON.stringify(data);
      data = merged;
      persist();
      if (s !== JSON.stringify(remote)) await pushRemote(merged);
      syncStatus = 'Synced at ' + clock();
      if (localChanged) safeRender();
    } catch (e) {
      syncStatus = (navigator.onLine ? 'Sync failed: ' + e.message : 'Offline') + ' — will retry';
    } finally {
      syncing = null;
      if (tab === 'settings') safeRender();
      if (again) { again = false; scheduleSync(); }
    }
  })();
  return syncing;
}

async function connect(token) {
  if (!token) return render();
  sync = { token, gistId: null };
  try {
    const found = (await gh('/gists?per_page=100')).find(g => g.files && g.files[FILE]);
    if (found) {
      sync.gistId = found.id;
      const remote = await pullRemote();
      const localEmpty = !Object.keys(data.log).length && !data.pauses.length;
      if (localEmpty) data = remote; // fresh device: just take the cloud copy
      else if (confirm('The cloud already has habit data. Merge it with the data on this device?')) data = L.merge(data, remote);
      else { sync = null; return render(); }
      persist();
      await pushRemote(data);
    } else {
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Habits app data — synced by the app, do not edit', public: false, files: { [FILE]: { content: JSON.stringify(data) } } }) });
      sync.gistId = g.id;
    }
    localStorage.setItem(SYNC_KEY, JSON.stringify(sync));
    syncStatus = 'Synced at ' + clock();
  } catch (e) {
    sync = null;
    alert('Could not connect: ' + e.message);
  }
  render();
}

function label(key) {
  const [y, m, d] = key.split('-').map(Number);
  const s = new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const t = today();
  return key === t ? `Today · ${s}` : key === L.addDays(t, -1) ? `Yesterday · ${s}` : s;
}
const freqText = f => f.kind === 'daily' ? 'Every day' : f.kind === 'weekly' ? `${f.times}× per week`
  : f.days.join() === '0,1,2,3,4' ? 'Weekdays' : f.days.join() === '5,6' ? 'Weekends' : f.days.map(d => WD[d]).join(', ');

function habitRow(h, paused) {
  const done = L.isDone(data, h.id, viewDay);
  const weekly = h.freq.kind === 'weekly';
  const bonus = h.freq.kind === 'days' && !L.isScheduled(h, viewDay);
  const sub = [h.note, weekly ? `${L.weekCount(data, h, viewDay)}/${h.freq.times} this week` : '', bonus ? freqText(h.freq) : ''].filter(Boolean).join(' · ');
  return `<li><button class="habit ${done ? 'done' : ''} ${weekly && !L.isDue(data, h, viewDay) ? 'met' : ''}"
    data-act="toggle" data-id="${esc(h.id)}" aria-pressed="${done}" ${paused ? 'disabled' : ''}>
    <span class="box">${done ? CHECK : ''}</span>
    <span class="txt"><span class="name">${esc(h.name)}</span>${sub ? `<span class="note">${esc(sub)}</span>` : ''}</span>
    ${bonus && done ? '<span class="tag" style="margin-left:auto">Bonus</span>' : ''}
  </button></li>`;
}

function renderToday() {
  const t = today(), y = L.addDays(t, -1);
  if (viewDay > t) viewDay = t;
  const paused = L.isPaused(data, viewDay);
  const active = data.habits.filter(h => !h.archived && h.created <= viewDay);
  const planned = active.filter(h => h.freq.kind !== 'days' || L.isScheduled(h, viewDay));
  const other = active.filter(h => !planned.includes(h));
  const s = L.dayScore(data, viewDay);
  const allDone = !paused && s.total > 0 && s.done === s.total;
  // nag only after 7 days without a backup (counted from first habit if never exported)
  const since = data.lastExport || data.habits.reduce((m, h) => h.created < m ? h.created : m, t);
  const needBackup = since < L.addDays(t, -7);
  // yesterday left open? (forgot to log vs really missed) — only on today's view, until reviewed
  const open = viewDay === t && ui.reviewed !== y
    ? data.habits.filter(h => !h.archived && L.cellStatus(data, h, y, t) === 'missed').length : 0;
  const empty = !active.length ? 'No habits yet. Add some in Settings.' : !planned.length ? 'Nothing scheduled for this day.' : '';
  return `
    ${open ? `<div class="banner info"><span>Yesterday: ${open} not logged</span>
      <button data-act="review">Review</button><button class="x" data-act="dismiss" aria-label="Dismiss">×</button></div>` : ''}
    ${needBackup ? `<button class="banner" data-act="export">Back up your data — tap to export</button>` : ''}
    <header class="day">
      <button data-act="prev" aria-label="Previous day">‹</button>
      <div>
        <div class="date">${label(viewDay)}</div>
        <div class="score ${allDone && celebrate ? 'pop' : ''}">${paused ? 'Paused' : `${s.done}/${s.total}`}</div>
        <div class="sub">${allDone ? 'All done' : ''}</div>
      </div>
      <button data-act="next" aria-label="Next day" ${viewDay >= t ? 'disabled' : ''}>›</button>
    </header>
    <ul class="list ${paused ? 'paused' : ''}">
      ${planned.map(h => habitRow(h, paused)).join('') || `<li class="empty">${empty}</li>`}
    </ul>
    ${other.length ? `<details class="more" ${other.some(h => L.isDone(data, h.id, viewDay)) ? 'open' : ''}>
      <summary>Not scheduled ${viewDay === t ? 'today' : 'this day'} (${other.length}) — tick as bonus</summary>
      <ul class="list ${paused ? 'paused' : ''}">${other.map(h => habitRow(h, paused)).join('')}</ul>
    </details>` : ''}
    <button class="ghost" data-act="pause">${paused ? 'Unpause this day' : 'Pause this day (sick, holiday…)'}</button>`;
}

function renderStats() {
  const t = today();
  const habits = data.habits.filter(h => !h.archived);
  const days = [];
  for (let i = range - 1; i >= 0; i--) days.push(L.addDays(t, -i));
  const pct = p => p == null ? '—' : p + '%';

  // overview
  const pcts = habits.map(h => L.percent(data, h, t, range)).filter(p => p != null);
  const avg = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null;
  const perfect = days.filter(k => { const s = L.dayScore(data, k); return !L.isPaused(data, k) && s.total > 0 && s.done === s.total; }).length;
  const missed = days.reduce((n, k) => n + habits.filter(h => L.cellStatus(data, h, k, t) === 'missed').length, 0);

  // habit × day grid
  const head = days.map(k => `<th><button class="dh${k === t ? ' today' : ''}${L.dow(k) >= 5 ? ' we' : ''}" data-act="open" data-day="${k}"
    aria-label="Open ${label(k)}"><span>${WD[L.dow(k)][0]}</span>${Number(k.slice(8))}</button></th>`).join('');
  const grid = habits.map(h => `<tr><th class="nm" title="${esc(h.name)}">${esc(h.name)}</th>${days.map(k => {
    const st = L.cellStatus(data, h, k, t);
    return `<td><i class="c ${st}" title="${k} · ${STATUS[st]}"></i></td>`;
  }).join('')}</tr>`).join('');

  // per habit
  const rows = habits.map(h => {
    const unit = h.freq.kind === 'weekly' ? ' wk' : '';
    const w = L.weakDay(data, h, t);
    return `<tr><td>${esc(h.name)}<div class="muted">${esc(freqText(h.freq))}</div></td>
      <td>${L.streak(data, h, t)}${unit}</td><td>${L.bestStreak(data, h, t)}${unit}</td><td>${pct(L.percent(data, h, t, range))}</td>
      <td class="${w ? 'weak' : ''}">${w ? `${WD[w.day]} <span class="muted">${Math.round(w.rate * 100)}%</span>` : '—'}</td></tr>`;
  }).join('');

  // 12-week overview
  const start = L.addDays(L.weekStart(t), -7 * 11);
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<b>${d}</b>`).join('');
  for (let i = 0; i < 84; i++) {
    const k = L.addDays(start, i);
    const cls = k === t ? ' today' : '';
    if (k > t) cells += '<i class="cell future"></i>';
    else if (L.isPaused(data, k)) cells += `<i class="cell pause${cls}" title="${k} · paused"></i>`;
    else {
      const s = L.dayScore(data, k);
      cells += `<i class="cell${cls}" style="--r:${s.total ? s.done / s.total : 0}" title="${k} · ${s.done}/${s.total}"></i>`;
    }
  }

  return `
    <div class="seg">${[7, 30, 90].map(n => `<button data-act="range" data-n="${n}" class="${n === range ? 'on' : ''}">${n} days</button>`).join('')}</div>
    <div class="cards">
      <div class="card"><b>${pct(avg)}</b><span>Completion</span></div>
      <div class="card"><b>${perfect}</b><span>Perfect days</span></div>
      <div class="card"><b>${missed}</b><span>Missed</span></div>
    </div>
    <h2>What you did, day by day</h2>
    ${habits.length ? `<div class="mx-wrap"><table class="mx"><tr><th class="nm"></th>${head}</tr>${grid}</table></div>
    <div class="legend"><span><i class="c done"></i>Done</span><span><i class="c missed"></i>Missed</span><span><i class="c off"></i>Not scheduled</span>
      <span><i class="c bonus"></i>Bonus</span><span><i class="c paused"></i>Paused</span></div>
    <p class="muted">Tap a date to open that day and fix it.</p>` : '<p class="muted">No habits yet.</p>'}
    <h2>Habits</h2>
    <table><tr><th>Habit</th><th>Streak</th><th>Best</th><th>${range} d</th><th>Most missed</th></tr>${rows}</table>
    <p class="muted">Streak counts scheduled days in a row (weeks for weekly habits). Paused and unscheduled days are skipped; today doesn't count against you until it's over. "Most missed" shows a weekday you skip at least 30 % of the time (last 90 days).</p>
    <h2>Last 12 weeks</h2>
    <div class="heat">${cells}</div>`;
}

function renderSettings() {
  const active = data.habits.filter(h => !h.archived);
  const archived = data.habits.filter(h => h.archived);
  const e = editing === 'new' ? { name: '', note: '', freq: { kind: 'daily' } } : data.habits.find(h => h.id === editing);
  const fv = e && (e.freq.kind === 'weekly' ? 'w' + e.freq.times : e.freq.kind);
  const opts = [['daily', 'Every day'], ['days', 'Specific days'], ...[1, 2, 3, 4, 5, 6].map(n => ['w' + n, `${n}× per week (any days)`])]
    .map(([v, t]) => `<option value="${v}" ${v === fv ? 'selected' : ''}>${t}</option>`).join('');
  const picked = e && e.freq.kind === 'days' ? e.freq.days : [0, 1, 2, 3, 4];
  const chips = WD.map((d, i) => `<label class="chip"><input type="checkbox" name="day" value="${i}" ${picked.includes(i) ? 'checked' : ''}><span>${d.slice(0, 2)}</span></label>`).join('');
  const row = (h, i, list) => `<div class="row">
      <span class="txt"><span class="name">${esc(h.name)}</span><span class="note">${esc([freqText(h.freq), h.note].filter(Boolean).join(' · '))}</span></span>
      ${h.archived ? `<button data-act="archive" data-id="${esc(h.id)}">Restore</button>` : `
        <button data-act="up" data-id="${esc(h.id)}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button data-act="down" data-id="${esc(h.id)}" aria-label="Move down" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
        <button data-act="edit" data-id="${esc(h.id)}">Edit</button>
        <button data-act="archive" data-id="${esc(h.id)}">Archive</button>`}
    </div>`;
  return `
    <h2>Habits</h2>
    ${e ? `<form id="hform" data-kind="${fv === 'days' ? 'days' : ''}">
      <label>Name <input name="name" required maxlength="60" value="${esc(e.name)}" autocomplete="off"></label>
      <label>What counts as done (optional) <input name="note" maxlength="60" value="${esc(e.note)}" placeholder="e.g. 5 g, 7+ h" autocomplete="off"></label>
      <label>How often <select name="freq">${opts}</select></label>
      <div class="days" role="group" aria-label="Days">${chips}</div>
      <div class="btns"><button class="btn primary" type="submit">${editing === 'new' ? 'Add habit' : 'Save'}</button><button class="btn" type="button" data-act="cancel">Cancel</button></div>
    </form>` : `<button class="btn" data-act="new">+ Add habit</button>`}
    ${active.map(row).join('') || '<p class="muted">No active habits.</p>'}
    ${archived.length ? `<h2>Archived (history kept)</h2>${archived.map(row).join('')}` : ''}
    <h2>Backup</h2>
    <p class="muted">Your data lives on this device${sync ? ' and in your private gist' : ' only'}. Last backup: ${data.lastExport ? label(data.lastExport) : 'never'}.
      ${persisted === true ? 'Storage is persistent.' : persisted === false ? 'The browser may clear storage when space runs low — export regularly.' : ''}</p>
    <button class="btn" data-act="export">Export backup (.json)</button>
    <button class="btn" data-act="import">Import backup</button>
    <h2>Sync between devices</h2>
    ${sync ? `
      <p class="muted">Synced through a private GitHub gist. ${esc(syncStatus)}</p>
      <button class="btn" data-act="syncnow">Sync now</button>
      <button class="btn" data-act="disconnect">Disconnect this device</button>` : `
      <p class="muted">Keeps phone and computer in sync through a private gist on your GitHub.
        Create a token at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent)">github.com → Fine-grained token</a>:
        Account permissions → <b>Gists: Read and write</b>, nothing else. Paste it on every device.</p>
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" style="width:100%">
      <button class="btn primary" data-act="connect">Connect</button>`}`;
}

function render() {
  document.getElementById('view').innerHTML = tab === 'today' ? renderToday() : tab === 'stats' ? renderStats() : renderSettings();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const name = document.querySelector('#hform input[name=name]');
  if (name && !name.value) name.focus();
  const mx = document.querySelector('.mx-wrap');
  if (mx) mx.scrollLeft = mx.scrollWidth; // newest days first in view
  celebrate = false;
}

function move(id, dir) {
  const idx = data.habits.findIndex(h => h.id === id);
  let j = idx + dir;
  while (j >= 0 && j < data.habits.length && data.habits[j].archived) j += dir; // skip archived
  if (j < 0 || j >= data.habits.length) return;
  [data.habits[idx], data.habits[j]] = [data.habits[j], data.habits[idx]];
  data.habits[idx].updated = data.habits[j].updated = Date.now(); // so the new order wins on sync
}

function exportData() {
  data.lastExport = today();
  save();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `habits-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; editing = null; if (tab === 'today') viewDay = today(); return render(); }
  const id = b.dataset.id;
  const h = data.habits.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'prev': viewDay = L.addDays(viewDay, -1); break;
    case 'next': if (viewDay < today()) viewDay = L.addDays(viewDay, 1); break;
    case 'toggle': {
      const before = L.dayScore(data, viewDay);
      L.toggle(data, id, viewDay);
      save();
      const after = L.dayScore(data, viewDay);
      celebrate = after.total > 0 && after.done === after.total && before.done !== before.total;
      if (navigator.vibrate) navigator.vibrate(celebrate ? [12, 70, 12] : 8);
      break;
    }
    case 'review': ui.reviewed = L.addDays(today(), -1); saveUi(); viewDay = ui.reviewed; break;
    case 'dismiss': ui.reviewed = L.addDays(today(), -1); saveUi(); break;
    case 'range': range = Number(b.dataset.n); break;
    case 'open': viewDay = b.dataset.day; tab = 'today'; break;
    case 'pause': L.togglePause(data, viewDay); save(); break;
    case 'new': editing = 'new'; break;
    case 'edit': editing = id; break;
    case 'cancel': editing = null; break;
    case 'up': move(id, -1); save(); break;
    case 'down': move(id, 1); save(); break;
    case 'archive': if (h) { h.archived = !h.archived; h.updated = Date.now(); if (editing === id) editing = null; save(); } break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); return;
    case 'connect': b.disabled = true; b.textContent = 'Connecting…'; connect(document.getElementById('token').value.trim()); return;
    case 'syncnow': syncStatus = 'Syncing…'; syncNow(); break;
    case 'disconnect':
      if (!confirm('Stop syncing this device? Data stays here and in the gist.')) return;
      localStorage.removeItem(SYNC_KEY); sync = null; syncStatus = ''; break;
    default: return;
  }
  render();
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const name = String(f.get('name')).trim();
  if (!name) return;
  const fv = String(f.get('freq'));
  let freq = fv === 'daily' ? { kind: 'daily' } : fv === 'days' ? { kind: 'days', days: f.getAll('day').map(Number).sort() } : { kind: 'weekly', times: Number(fv.slice(1)) };
  if (freq.kind === 'days' && !freq.days.length) return alert('Pick at least one day.');
  if (freq.kind === 'days' && freq.days.length === 7) freq = { kind: 'daily' };
  const note = String(f.get('note')).trim();
  const updated = Date.now();
  if (editing === 'new') data.habits.push({ id: L.newId(), name, note, type: 'check', freq, created: today(), archived: false, updated });
  else Object.assign(data.habits.find(h => h.id === editing), { name, note, freq, updated });
  editing = null;
  save();
  render();
});

// show weekday chips only for "Specific days"
document.addEventListener('change', ev => {
  if (ev.target.name === 'freq') ev.target.form.dataset.kind = ev.target.value === 'days' ? 'days' : '';
});

document.getElementById('importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { return alert('That file is not valid JSON.'); }
  if (!L.validate(obj)) return alert('That file is not a Habits backup. Nothing was changed.');
  const days = Object.keys(obj.log).length;
  if (!confirm(`Replace all current data with this backup (${obj.habits.length} habits, ${days} logged days)?`)) return;
  data = obj;
  save();
  render();
});

// "today" moves at 04:00 even if the app stayed open
// leaving the app: push pending changes now. Coming back: pull what the other device did.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (syncTimer) syncNow(); return; }
  const t = today();
  if (t !== lastToday) { if (viewDay === lastToday) viewDay = t; lastToday = t; }
  safeRender();
  syncNow();
});
window.addEventListener('online', () => syncNow());

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { persisted = ok; if (tab === 'settings') render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
syncNow();
</script>
</body>
</html>
