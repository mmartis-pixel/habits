<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>OLYX</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaed; --muted:#8b93a1; --accent:#34d399; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); overflow-x: clip; } /* clip: animations never cause sideways scroll */
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h2 { font-size: 1rem; color: var(--muted); font-weight: 600; margin: 24px 0 8px; }

  nav { position: fixed; inset: auto 0 0 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; padding: 14px 0; color: var(--muted); font-weight: 600; }
  nav button.on { color: var(--accent); }

  .day { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day > button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 1.6rem; line-height: 1; }
  .day > button:disabled { opacity: .3; }
  .day .date { text-align: center; font-weight: 700; font-size: 1.15rem; }
  .day .score { text-align: center; color: var(--accent); font-weight: 700; font-size: 1.6rem; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .list.paused { opacity: .4; }
  .habit { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .habit .box { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; color: var(--bg); }
  .habit.done .box { background: var(--accent); border-color: var(--accent); }
  .habit.done .name { color: var(--muted); }
  .habit.met:not(.done) { opacity: .55; }
  .txt { display: flex; flex-direction: column; }
  .note { font-size: .85rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  .ghost, .btn { margin-top: 16px; width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--muted); }
  .btn { border-style: solid; background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  .banner { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--warn); background: none; color: var(--warn); text-align: left; }

  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
  .heat b { font-size: .7rem; color: var(--muted); font-weight: 500; display: grid; place-items: center; }
  /* 12-week dots: colour = share done (red → orange → yellow → green), perfect day = glowing green */
  .dots { display: grid; grid-template-rows: 16px repeat(7, 20px); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    gap: 4px 2px; align-items: center; justify-items: center; }
  .dots .dl, .dots .mh { font-size: .62rem; color: var(--muted); justify-self: start; white-space: nowrap; }
  .dt { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; background: var(--rc, #2a2e37); transition: transform .12s; }
  .dt::after { content: ''; position: absolute; inset: -5px; } /* bigger tap target */
  .dt.full { width: 14px; height: 14px; background: linear-gradient(#6ee7b7, #10b981); box-shadow: 0 0 0 2px rgb(52 211 153 / .22), 0 0 8px rgb(52 211 153 / .6); }
  .dt.rest { width: 4px; height: 4px; background: #2f343e; }
  .dt.paused { background: repeating-linear-gradient(45deg, #4b5260 0 2px, #1c1f26 2px 4px); }
  .dt.future { width: 4px; height: 4px; background: #1d2027; }
  .dt.today { outline: 1.5px solid var(--text); outline-offset: 2.5px; }
  .dt[data-day]:hover { transform: scale(1.4); }
  #tip { position: fixed; z-index: 35; width: 210px; padding: 10px 12px; border-radius: 12px; background: #1d2129; border: 1px solid var(--line);
    box-shadow: 0 12px 30px rgb(0 0 0 / .5); font-size: .8rem; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  #tip.show { opacity: 1; transform: none; pointer-events: auto; }
  #tip b { display: block; }
  #tip > span { display: block; font-weight: 600; margin: 1px 0 6px; }
  #tip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #tip li { display: flex; align-items: center; gap: 7px; color: var(--muted); }
  #tip li::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #3a404c; }
  #tip li.ok { color: var(--text); } #tip li.ok::before { background: var(--accent); }
  #tip li.no::before { background: #f87171; }
  #tip em { font-style: normal; font-size: .68rem; color: var(--accent); }
  #tip button { margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-weight: 600; }
  body.still *, body.still *::before, body.still *::after { animation: none !important; transition: none !important; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  td:first-child, th:first-child { text-align: left; white-space: normal; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }

  .row { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row .txt { flex: 1; min-width: 0; }
  .row button { min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 10px; }
  .row button:disabled { opacity: .3; }
  form { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  form .btns { display: flex; gap: 8px; }
  form .btns .btn { margin: 0; }
  .muted { color: var(--muted); font-size: .85rem; }

  /* check mark + completion */
  .habit .box svg { width: 18px; height: 18px; fill: none; stroke: var(--bg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .day .sub { text-align: center; font-size: .8rem; color: var(--muted); min-height: 1.1em; }
  .score.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.25); text-shadow: 0 0 18px rgb(52 211 153 / .7); } 100% { transform: scale(1); } }
  .tag { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }

  /* banners */
  .banner.info { display: flex; align-items: center; gap: 8px; border-color: var(--line); background: var(--card); color: var(--text); }
  .banner.info span { flex: 1; }
  .banner.info button { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 6px; }
  .banner.info button.x { color: var(--muted); font-size: 1.2rem; line-height: 1; }

  /* not scheduled today */
  details.more { margin-top: 16px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 6px 2px; list-style: none; }
  details.more summary::before { content: '▸ '; }
  details.more[open] summary::before { content: '▾ '; }
  details.more .habit { min-height: 50px; opacity: .8; }

  /* form: weekday chips */
  .days { display: none; gap: 6px; }
  form[data-kind=days] .days { display: flex; }
  .chip { flex: 1; display: block; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; text-align: center; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 600; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip input:focus-visible + span { outline: 2px solid var(--text); }

  /* stats */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 0; border-radius: 9px; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--line); color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card b { display: block; font-size: 1.4rem; }
  .card span { font-size: .75rem; color: var(--muted); }
  .mx-wrap { overflow-x: auto; scrollbar-width: thin; }
  .mx { border-collapse: collapse; width: auto; }
  .mx td, .mx th { padding: 1.5px; border: 0; text-align: center; } /* padding, not border-spacing: no gaps for scrolled cells to show through */
  .mx .nm { position: sticky; left: 0; z-index: 1; background: var(--bg); text-align: left; font-weight: 500; font-size: .85rem;
    max-width: 110px; min-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; box-shadow: -4px 0 0 var(--bg); }
  .dh { border: 0; background: none; color: var(--muted); font-size: .7rem; line-height: 1.2; padding: 2px 0; width: 22px; }
  .dh span { display: block; font-size: .6rem; }
  .dh.we { color: #a3abb8; }
  .dh.today { color: var(--text); font-weight: 700; }
  .c { display: block; width: 22px; height: 22px; border-radius: 5px; }
  .c.done { background: var(--accent); }
  .c.missed { background: rgb(248 113 113 / .18); box-shadow: inset 0 0 0 1.5px rgb(248 113 113 / .75); }
  .c.pending { box-shadow: inset 0 0 0 1.5px var(--muted); }
  .c.off { background: radial-gradient(circle, #2a2e37 2px, transparent 2.5px); }
  .c.bonus { background: radial-gradient(circle, var(--accent) 4px, transparent 4.5px); box-shadow: inset 0 0 0 1.5px rgb(52 211 153 / .4); }
  .c.paused { background: repeating-linear-gradient(45deg, #2a2e37 0 3px, #1c1f26 3px 6px); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .75rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 5px; border-radius: 3px; }
  .legend .c { width: 12px; height: 12px; }
  td.weak { color: #f87171; }
  td.st .flame { margin-right: 3px; }

  /* streak flames */
  .flame { width: 17px; height: 17px; vertical-align: -3px; flex: none; overflow: visible; --glow: transparent; --gs: 0px;
    filter: drop-shadow(0 0 var(--gs) var(--glow)); }
  /* tiers: glow grows, colour shifts, sparkles from Violet, shimmer from Golden, colour cycle for Legend */
  .flame.t1 { --glow: rgb(249 115 22 / .55); --gs: 2px; }
  .flame.t2 { --glow: rgb(239 68 68 / .65); --gs: 3px; width: 18px; height: 18px; }
  .flame.t3 { --glow: rgb(59 130 246 / .8); --gs: 4px; width: 19px; height: 19px; }
  .flame.t4 { --glow: rgb(168 85 247 / .85); --gs: 4px; width: 19px; height: 19px; }
  .flame.t5 { --glow: rgb(245 158 11 / .9); --gs: 5px; width: 20px; height: 20px; animation: shimmer 2.4s ease-in-out infinite; }
  .flame.t6 { --glow: rgb(236 72 153 / .9); --gs: 5px; width: 20px; height: 20px; animation: shimmer 1.8s ease-in-out infinite; }
  .flame.t7 { --glow: rgb(255 255 255 / .75); --gs: 6px; width: 21px; height: 21px; animation: legend 5s linear infinite; }
  .flame .sp { fill: #fff; animation: twinkle 1.6s ease-in-out infinite; }
  .flame .sp:nth-of-type(2) { animation-delay: .55s; } .flame .sp:nth-of-type(3) { animation-delay: 1.1s; }
  @keyframes shimmer { 50% { filter: drop-shadow(0 0 calc(var(--gs) * 2.2) var(--glow)) brightness(1.18); } }
  @keyframes legend { from { filter: drop-shadow(0 0 6px var(--glow)) hue-rotate(0deg); } to { filter: drop-shadow(0 0 6px var(--glow)) hue-rotate(360deg); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  .tc0, .tc1 { --tc: #fbbf24; } .tc2 { --tc: #fb7185; } .tc3 { --tc: #60a5fa; } .tc4 { --tc: #c084fc; }
  .tc5 { --tc: #fcd34d; } .tc6 { --tc: #f472b6; } .tc7 { --tc: #fde68a; }
  .streak { margin-left: auto; display: flex; align-items: center; gap: 3px; font-weight: 700; font-size: .9rem; color: var(--tc, #fbbf24);
    padding: 3px 9px 3px 6px; border-radius: 999px; background: color-mix(in srgb, var(--tc, #fbbf24) 13%, transparent); flex: none; }
  .streak.cold { background: none; }
  .streak.cold, .pstreak.cold { color: var(--muted); }
  .cold .flame { filter: grayscale(1) !important; opacity: .5; animation: none !important; }
  .cold .flame .sp { display: none; }
  /* tick: box pops, flame catches fire, embers rise, number bumps */
  .habit.ignite .box { animation: box-pop .35s cubic-bezier(.2, 1.8, .4, 1); }
  @keyframes box-pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  .streak { position: relative; }
  .streak.ignite { animation: pill-flash .9s ease-out; }
  @keyframes pill-flash { 0% { background: color-mix(in srgb, var(--tc) 45%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--tc) 60%, transparent); } }
  .streak.ignite .flame { transform-origin: 50% 90%; animation: ignite .75s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes ignite {
    0% { transform: scale(.2) rotate(-18deg); filter: grayscale(1) brightness(.6); }
    35% { transform: scale(1.7) rotate(10deg); filter: brightness(1.8) drop-shadow(0 0 10px var(--tc, #f97316)); }
    65% { transform: scale(.88) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .streak.ignite b { display: inline-block; animation: num-bump .5s cubic-bezier(.2, 1.8, .4, 1) .15s both; }
  @keyframes num-bump { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .ember { position: absolute; left: 13px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--tc, #fbbf24);
    box-shadow: 0 0 6px var(--tc, #fbbf24); opacity: 0; animation: ember .8s ease-out forwards; pointer-events: none; }
  @keyframes ember { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), -28px) scale(.2); } }
  .habit.early { opacity: .6; border-style: dashed; }
  .pstreak { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .8rem; color: var(--tc, #fbbf24); margin-top: 2px; }
  td.st { color: var(--text); }

  /* celebration cards */
  .cel { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; }
  .cel-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgb(15 17 21 / .78), rgb(5 6 8 / .94)); animation: fade .25s; }
  .cel-card { position: relative; width: min(360px, 100%); text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    padding: 28px 22px 20px; overflow: hidden; animation: rise .45s cubic-bezier(.2, 1.4, .4, 1); box-shadow: 0 30px 80px rgb(0 0 0 / .6); }
  .cel-card.tier { border-color: color-mix(in srgb, var(--tc) 55%, transparent); }
  @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  .cel-rays { position: absolute; left: 50%; top: 95px; width: 520px; height: 520px; margin: -260px 0 0 -260px; pointer-events: none; opacity: .5;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--tc) 35%, transparent) 0 8deg, transparent 8deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 62%); mask: radial-gradient(circle, #000 15%, transparent 62%); animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cel-flame { position: relative; height: 130px; display: grid; place-items: center; }
  .flame.big { width: 118px; height: 118px; --gs: 14px; animation: pop-in .7s cubic-bezier(.2, 1.6, .4, 1) both, breathe 2.4s ease-in-out .7s infinite; }
  @keyframes pop-in { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.06); filter: drop-shadow(0 0 22px var(--glow)) brightness(1.1); } }
  .flame.big.t7 { animation: pop-in .7s cubic-bezier(.2, 1.6, .4, 1) both, legend 5s linear .7s infinite; }
  .cel-num { position: relative; display: flex; justify-content: center; align-items: baseline; gap: 8px; margin-top: 4px; }
  .cel-num b { font-size: 3.2rem; line-height: 1; color: var(--tc); font-variant-numeric: tabular-nums; }
  .cel-num span { color: var(--muted); font-weight: 600; }
  .cel-title { position: relative; font-size: 1.45rem; font-weight: 800; margin-top: 6px; letter-spacing: -.01em; }
  .cel-sub { position: relative; color: var(--muted); margin-top: 4px; }
  .cel-next { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px 0 4px; padding: 10px; border-radius: 12px;
    background: var(--bg); font-size: .85rem; color: var(--muted); }
  .cel-next b { color: var(--text); }
  .flame.mini { width: 18px; height: 18px; }
  .cel-card .btn { position: relative; margin-top: 16px; }
  .cel-badge { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--tc); border: 1px solid currentColor; }
  /* day complete */
  .ring { width: 104px; height: 104px; display: block; margin: 0 auto 6px; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 327; transform: rotate(-90deg); transform-origin: 60px 60px;
    animation: fill-ring .8s cubic-bezier(.6, 0, .2, 1) .1s forwards; }
  .ring .ck { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 70; stroke-dashoffset: 70;
    animation: draw .35s ease-out .85s forwards; }
  @keyframes fill-ring { to { stroke-dashoffset: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cel-streak { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; color: var(--tc); }
  .cel-streak b { font-size: 1.6rem; }
  .cel-streak span { color: var(--muted); }
  .flame.mid { width: 30px; height: 30px; --gs: 6px; }
  .week { display: flex; justify-content: space-between; gap: 4px; margin: 18px 0 4px; }
  .wd { flex: 1; display: grid; justify-items: center; gap: 4px; font-size: .7rem; color: var(--muted); }
  .wd i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid var(--line); }
  .wd.on i { background: var(--accent); border-color: var(--accent); }
  .wd.on i svg { width: 16px; height: 16px; fill: none; stroke: var(--bg); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .wd.pause i { background: repeating-linear-gradient(45deg, #2a2e37 0 3px, #1c1f26 3px 6px); }
  .wd.now span { color: var(--text); font-weight: 700; }
  .wd.now i { animation: now-pop .6s cubic-bezier(.2, 1.6, .4, 1) 1s both; box-shadow: 0 0 0 4px rgb(52 211 153 / .25); }
  @keyframes now-pop { from { transform: scale(.3); } }
  /* "calm" = big motion off (rotating rays, breathing flame); small effects stay. Set by Settings → Effects */
  body.calm .cel-rays, body.calm .flame.big { animation: none !important; }
  .row button.danger { color: #f87171; border-color: rgb(248 113 113 / .4); }

  /* onboarding */
  body.onboarding nav { display: none; }
  .ob { min-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .ob0, .ob2 { justify-content: center; align-items: center; text-align: center; gap: 4px; }
  .logo { width: 92px; height: 92px; filter: drop-shadow(0 0 18px rgb(52 211 153 / .35)); }
  .ob0 h1 { font-size: 2.6rem; letter-spacing: .22em; margin: 14px 0 0 .22em; }
  .ob0 p { color: var(--muted); font-size: 1.1rem; margin: 6px 0 36px; line-height: 1.5; }
  .ob0 .btn, .ob2 .btn { max-width: 340px; }
  .ob-h { font-size: 1.45rem; margin: 8px 0 4px; color: var(--text); }
  .btn:disabled { opacity: .45; }
  .remrow { display: flex; gap: 10px; align-items: end; }
  /* Plan on phones: habit × weekday circles; the column board stays for wide screens */
  .pm, .only-narrow { display: none; }
  @media (max-width: 899px) {
    .board, .only-wide { display: none !important; }
    .pm { display: block; } .only-narrow { display: block; }
  }
  .pm-head, .pm-row, .pm-count { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 27px); gap: 2px; align-items: center; }
  .pm-head { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
  .pm-head b { text-align: center; font-size: .72rem; color: var(--muted); font-weight: 600; }

  { at: 50, name: 'Violet flame' }, { at: 100, name: 'Golden flame' }, { at: 200, name: 'Inferno' }, { at: 365, name: 'Legend' },

function load() {

  if (raw) {
    try { const d = JSON.parse(raw); if (L.validate(d)) return d; } catch (e) {}
    // never overwrite unreadable data: keep a copy aside
    localStorage.setItem(KEY + '-corrupt-' + Date.now(), raw);
    alert('Saved data could not be read. A copy was kept. Starting fresh — import a backup in Settings.');
  }
  const d = { version: 1, habits: [], log: {}, pauses: [], lastExport: null }; // onboarding fills it
  localStorage.setItem(KEY, JSON.stringify(d));

// the account copy is merged on each device (L.merge), pushes carry the rev they pulled (409 = pull + merge again).
const SYNC_KEY = 'olyx-account'; // { session, email, uid } — kept apart from data so it never lands in an export
const GOOGLE_CLIENT_ID = '473320517458-sh8gicjmbgeli95a8avu1cdgqim83fke.apps.googleusercontent.com';

let syncStatus = '';
let syncTimer = null, syncing = null, again = false;

async function api(path, body) {
  const r = await fetch(PUSH_API + path, { method: 'POST', cache: 'no-store',
    headers: { 'Content-Type': 'application/json', ...(sync ? { Authorization: 'Bearer ' + sync.session } : {}) }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && sync && path !== '/auth/google') { signedOut(); throw new Error('signed out — sign in again'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'server error ' + r.status), { status: r.status });
  return j;
}
function signedOut() { localStorage.removeItem(SYNC_KEY); sync = null; snapshot(); }
const clock = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

function scheduleSync() {
  if (!sync) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
// pull -> merge -> push if the account copy is behind. Failures keep local data; next sync retries.
function syncNow() {
  clearTimeout(syncTimer); syncTimer = null;
  if (!sync) return Promise.resolve();
  if (syncing) { again = true; return syncing; }
  syncing = (async () => {
    try {
      for (let i = 0; i < 3; i++) { // another device pushed in between (409) → merge its version too
        const remote = await api('/sync/pull');
        const merged = remote.data && L.validate(remote.data) ? L.merge(data, remote.data) : data;
        const m = JSON.stringify(merged), localChanged = m !== JSON.stringify(data);
        data = merged;
        persist();
        if (localChanged) safeRender();
        if (remote.data && m === JSON.stringify(remote.data)) break;
        try { await api('/sync/push', { data: merged, rev: remote.rev }); break; } catch (e) { if (e.status !== 409) throw e; }
      }
      syncStatus = 'Synced at ' + clock();
    } catch (e) {
      syncStatus = (navigator.onLine ? 'Sync failed: ' + e.message : 'Offline') + ' — will retry';
    } finally {
      syncing = null;
      if (tab === 'settings') safeRender();
      if (again) { again = false; scheduleSync(); }
    }
  })();
  return syncing;
}

function habitRow(h, paused) {

function renderToday() {
  const t = today(), y = L.addDays(t, -1);

  const planned = active.filter(h => h.freq.kind !== 'days' || L.isScheduled(h, viewDay));
  const other = active.filter(h => !planned.includes(h));

  const allDone = !paused && s.total > 0 && s.done === s.total;

      </div>

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function pctColor(p) {
  const stops = [[0, 0], [.33, 14], [.5, 30], [.66, 50], [.8, 88], [1, 140]];
  let i = 1;
  while (i < stops.length - 1 && p > stops[i][0]) i++;
  const [p0, h0] = stops[i - 1], [p1, h1] = stops[i];
  return `hsl(${Math.round(h0 + (h1 - h0) * (p - p0) / (p1 - p0))} 85% 58%)`;
}
// one day as a dot (12-week view + monthly review); colour = share done, perfect day = glowing green
function dayDot(k, t) {
  if (k > t) return '<i class="dt future"></i>';
  const now = k === t ? ' today' : '', at = `data-act="dot" data-day="${k}"`;
  if (L.isPaused(data, k)) return `<button class="dt paused${now}" ${at} aria-label="${label(k)}, paused"></button>`;
  const s = L.dayScore(data, k);
  if (!s.total) return `<button class="dt rest${now}" ${at} aria-label="${label(k)}, nothing planned"></button>`;
  const p = s.done / s.total;
  return `<button class="dt ${p === 1 ? 'full' : 'part'}${now}" ${at} style="--rc:${pctColor(p)}" aria-label="${label(k)}, ${s.done} of ${s.total} done"></button>`;
}

    }).join('')}</ul>` : ''}
    ${canHover ? '' : `<button data-act="open" data-day="${k}">Open day ›</button>`}`;
  tip.classList.add('show');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + 'px';
  tip.style.top = (r.top - th - 10 > 8 ? r.top - th - 10 : r.bottom + 10) + 'px';
  tipDay = k;
}
function hideTip() { document.getElementById('tip')?.classList.remove('show'); tipDay = null; }
document.addEventListener('mouseover', e => { const d = canHover && e.target.closest('.dt[data-day]'); if (d) showTip(d); });
document.addEventListener('mouseout', e => { if (canHover && e.target.closest('.dt[data-day]')) hideTip(); });
addEventListener('scroll', hideTip, { passive: true });

// ---- Plan: 8 columns (Every day + Mon..Sun), flexible habits below ----
const FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function renderPlan() {
  const active = data.habits.filter(h => !h.archived);
  const todayDow = L.dow(today());
  const cols = [
    { key: 'daily', title: 'Every day', list: active.filter(h => h.freq.kind === 'daily') },
    ...WD.map((d, i) => ({ key: i, title: d, today: i === todayDow, list: active.filter(h => h.freq.kind === 'days' && h.freq.days.includes(i)) })),
  ];
  const flex = active.filter(h => h.freq.kind === 'weekly');
  const archived = data.habits.filter(h => h.archived);
  const card = h => `<button class="pcard" data-act="edit" data-id="${esc(h.id)}" title="${esc([h.name, h.note].filter(Boolean).join(' — '))}">
    <span class="name">${esc(h.name)}</span>${h.note ? `<span class="note">${esc(h.note)}</span>` : ''}
    ${h.freq.kind === 'weekly' ? `<span class="note">${freqText(h.freq)}</span>` : ''}</button>`;
  // cards shrink as the fullest column grows, so ~10 habits still fit on one screen
  const most = Math.max(...cols.map(c => c.list.length));
  const density = most >= 9 ? 'dense' : most >= 6 ? 'compact' : '';
  // phone: one row per habit with 7 day circles — tap to plan / unplan a day (the board below is for wide screens)
  const planned = active.filter(h => h.freq.kind !== 'weekly');
  const onDay = (h, d) => h.freq.kind === 'daily' || h.freq.days.includes(d);
  const matrix = `<div class="pm">
    <div class="pm-head"><span></span>${WD.map((d, i) => `<b class="${i === todayDow ? 'now' : ''}">${d[0]}</b>`).join('')}</div>
    ${planned.map(h => `<div class="pm-row">
      <button class="pm-name" data-act="edit" data-id="${esc(h.id)}"><span class="name">${esc(h.name)}</span>
        <span class="note">${esc([h.freq.kind === 'daily' ? 'Every day' : freqText(h.freq), h.note].filter(Boolean).join(' · '))}</span></button>
      ${WD.map((d, i) => `<button class="pm-d ${onDay(h, i) ? 'on' : ''} ${i === todayDow ? 'now' : ''}" data-act="pday" data-id="${esc(h.id)}" data-d="${i}"
        aria-pressed="${onDay(h, i)}" aria-label="${esc(h.name)} on ${FULL[i]}"></button>`).join('')}
    </div>`).join('') || '<p class="muted">No habits planned yet.</p>'}
    ${planned.length ? `<div class="pm-count"><span>Habits per day</span>${WD.map((d, i) => `<b>${planned.filter(h => onDay(h, i)).length}</b>`).join('')}</div>` : ''}
    <button class="add" data-act="new" data-col="any">+ Add habit</button>
  </div>`;
  const names = new Set(data.habits.map(h => h.name.toLowerCase()));
  const left = SUGGEST.map((s, i) => [s, i]).filter(([s]) => !names.has(s[0].toLowerCase()));
  const ideas = active.length < 5 && left.length ? `<div class="ideas"><b>${active.length ? 'More ideas' : 'Start with a few of these'}</b>
    <div>${left.map(([[name, note], i]) => `<button class="idea" data-act="suggest" data-i="${i}">+ ${name}${note ? `<span>${note}</span>` : ''}</button>`).join('')}</div>
    <p class="ideas-note">You can change the name, details and days anytime — just tap the habit.</p></div>` : '';
  return `
    <h1 class="title">Weekly plan</h1>
    ${ideas}
    <p class="muted only-wide">Add habits to the days you want to do them. "Every day" habits show up on every day.</p>
    <p class="muted only-narrow">Tap a circle to plan a habit on that day. Tap a name to edit it.</p>
    ${matrix}
    <div class="board ${density}">${cols.map(c => `<section class="col${c.today ? ' today' : ''}">
      <header><b>${c.title}</b><span>${c.list.length}</span>${c.today ? '<em>Today</em>' : ''}</header>
      ${c.list.map(card).join('') || '<p class="muted empty-col">Nothing yet</p>'}
      <button class="add" data-act="new" data-col="${c.key}">+ Add</button>
    </section>`).join('')}</div>
    <h2>Flexible — any days of the week</h2>
    <div class="flexlist">${flex.map(card).join('')}<button class="add" data-act="new" data-col="flex">+ Add flexible habit (e.g. 3× per week)</button></div>
    ${archived.length ? `<h2>Archived (history kept)</h2>${archived.map(h => `<div class="row">
      <span class="txt"><span class="name">${esc(h.name)}</span><span class="note">${esc(freqText(h.freq))}</span></span>
      <button data-act="archive" data-id="${esc(h.id)}">Restore</button>
      <button class="danger" data-act="delete" data-id="${esc(h.id)}">Delete</button></div>`).join('')}` : ''}
    ${editing ? sheet() : ''}`;
}

// add / edit dialog
let addCol = null; // where "+ Add" was pressed: 'daily' | 'flex' | 0..6
function sheet() {
  const isNew = editing === 'new';
  const preset = addCol === 'daily' || addCol === 'any' ? { kind: 'daily' } : addCol === 'flex' ? { kind: 'weekly', times: 3 } : { kind: 'days', days: [addCol] };
  const e = isNew ? { name: '', note: '', freq: preset } : data.habits.find(h => h.id === editing);
  if (!e) return '';
  const fv = e.freq.kind === 'weekly' ? 'w' + e.freq.times : e.freq.kind;
  // flexible habits pick only "N× per week", the rest only "Every day" / "Specific days"
  const flexible = e.freq.kind === 'weekly';
  const opts = (flexible ? [1, 2, 3, 4, 5, 6].map(n => ['w' + n, `${n}× per week`]) : [['daily', 'Every day'], ['days', 'Specific days']])
    .map(([v, t]) => `<option value="${v}" ${v === fv ? 'selected' : ''}>${t}</option>`).join('');
  const picked = e.freq.kind === 'days' ? e.freq.days : [0, 1, 2, 3, 4];
  const chips = WD.map((d, i) => `<label class="chip"><input type="checkbox" name="day" value="${i}" ${picked.includes(i) ? 'checked' : ''}><span>${d.slice(0, 2)}</span></label>`).join('');
  const day = typeof addCol === 'number' ? addCol : null;
  // same habit on several days = one habit (keeps its stats together)
  const existing = isNew && day !== null ? data.habits.filter(h => !h.archived && h.freq.kind === 'days' && !h.freq.days.includes(day)) : [];
  const title = !isNew ? 'Edit habit' : day !== null ? `Add to ${FULL[day]}` : addCol === 'daily' ? 'Add every-day habit' : addCol === 'any' ? 'Add habit' : 'Add flexible habit';
  return `<div class="backdrop" data-act="cancel"></div>
    <form id="hform" class="sheet" data-kind="${fv === 'days' ? 'days' : ''}" role="dialog" aria-modal="true" aria-label="${title}">
      <h3>${title}</h3>
      ${existing.length ? `<div class="quick"><span class="muted">Add existing:</span>${existing.map(h =>
        `<button type="button" class="qchip" data-act="addday" data-id="${esc(h.id)}">${esc(h.name)}</button>`).join('')}</div>
        <div class="or">or create a new one</div>` : ''}
      <label>Name <input name="name" required maxlength="60" value="${esc(e.name)}" placeholder="e.g. Gym" autocomplete="off"></label>
      <label><span>Details <span class="rec">recommended</span></span>
        <input name="note" maxlength="80" value="${esc(e.note)}" placeholder="What counts as done, e.g. push day, 45 min" autocomplete="off"></label>
      <label>${flexible ? 'Times per week (any days)' : 'How often'} <select name="freq">${opts}</select></label>
      <div class="days" role="group" aria-label="Days">${chips}</div>
      <div class="btns"><button class="btn primary" type="submit">${isNew ? 'Add habit' : 'Save'}</button><button class="btn" type="button" data-act="cancel">Cancel</button></div>
      ${isNew ? '' : `<div class="btns secondary">
        <button class="btn" type="button" data-act="detail" data-id="${esc(e.id)}">History</button>
        <button class="btn" type="button" data-act="up" data-id="${esc(e.id)}">Move up</button>
        <button class="btn" type="button" data-act="down" data-id="${esc(e.id)}">Move down</button>
        <button class="btn" type="button" data-act="archive" data-id="${esc(e.id)}">Archive</button></div>`}
    </form>`;
}

const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v, t]) => `<button data-act="${act}" data-v="${v}" class="${String(v) === String(cur) ? 'on' : ''}">${t}</button>`).join('')}</div>`;

// ---- Gym tab: your split (templates), a split helper, workouts. Rules live in logic.js (L.*). ----
let gymSheet = null; // { kind: 'helper' | 'template' | 'workout' | 'past' | 'exercise', ... }
const G = () => L.gymOf(data);
const exName = id => (G().exercises.find(e => e.id === id) || {}).name || 'Deleted exercise';
const dayList = days => days.length ? [...days].sort((x, y) => x - y).map(d => WD[d]).join(' · ') : 'Any day';
const doneSets = w => w.items.reduce((n, i) => n + i.sets.filter(s => s.done).length, 0);
const gymWrap = (title, body, cls = '') => `<div class="backdrop" data-act="g-close"></div>

const dayChips = (act, on) => `<div class="gdays">${WD.map((d, i) => `<button class="gday${on.includes(i) ? ' on' : ''}" data-act="${act}" data-v="${i}" aria-pressed="${on.includes(i)}">${d.slice(0, 2)}</button>`).join('')}</div>`;
const exPicker = act => `<div class="gadd"><input data-g="exname" list="gexlist" placeholder="Add exercise" maxlength="40" aria-label="Exercise name">

function renderGym() {
  const g = G(), t = today();
  if (!g.templates.length && !g.workouts.length) return `<h2>Gym</h2>

    <h3 class="gh">My split</h3>

      <button class="gs" data-act="g-start" data-id="${p.id}">Start</button></li>`).join('')}</ul>` : '<p class="muted">No workouts planned yet.</p>'}
    <div class="glinks"><button class="btn link" data-act="g-tpl" data-id="new">+ New workout</button><button class="btn link" data-act="g-helper">Suggest a split</button></div>
    <h3 class="gh">Recent</h3>

      <b>${label(w.day)}${w.tpl && tplName(w.tpl) ? ' · ' + esc(tplName(w.tpl)) : ''}</b>
      <span class="muted">${w.items.length} exercise${w.items.length === 1 ? '' : 's'} · ${doneSets(w)} sets</span></button></li>`).join('')}</ul>` : '<p class="muted">No workouts yet.</p>'}`;
}

function helperSheet() {
  const s = gymSheet, ok = s.days.length >= 2 && s.days.length <= 6;

    <p class="muted">Which days do you train?</p>${dayChips('g-hday', s.days)}

    <p class="muted">Goal</p>${seg('g-hgoal', s.goal, [['strength', 'Strength'], ['muscle', 'Muscle']])}
    ${ok ? `<div class="gprev">${s.preview.map(p => `<div class="card"><b>${esc(p.name)}</b> <span class="muted">${dayList(p.days)}</span>

function templateSheet() {

    <label class="gl">Name<input data-g="tname" value="${esc(d.name)}" placeholder="Push" maxlength="40"></label>

      <span class="gsr"><input data-g="tsets" data-k="${k}" inputmode="numeric" value="${it.sets}" aria-label="Sets"> × <input data-g="treps" data-k="${k}" value="${esc(it.reps)}" aria-label="Reps"></span>
      <span class="gmv"><button data-act="g-tup" data-k="${k}" aria-label="Move up">↑</button><button data-act="g-tdown" data-k="${k}" aria-label="Move down">↓</button><button data-act="g-tdel" data-k="${k}" aria-label="Remove">×</button></span></li>`).join('')}</ul>

function gymSheetHtml() {
  const k = gymSheet.kind;
  return k === 'helper' ? helperSheet() : k === 'template' ? templateSheet()
    : typeof gymMoreSheets === 'function' ? gymMoreSheets() : '';
}

// keep the Workout habit in step with the split's days; tell the user when its days changed
function syncWorkoutHabit() {
  const before = JSON.stringify((data.habits.find(x => x.id === G().habitId) || {}).freq);
  const h = L.linkWorkoutHabit(data, today());
  if (h && JSON.stringify(h.freq) !== before) toast('Workout habit updated', h.freq.kind === 'daily' ? 'Every day' : dayList(h.freq.days));
}

function gymAction(b) {
  const s = gymSheet, v = b.dataset.v, k = Number(b.dataset.k), now = Date.now();
  const flip = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x].sort((p, q) => p - q);
  switch (b.dataset.act) {
    case 'g-close': gymSheet = null; break;
    case 'g-helper': gymSheet = { kind: 'helper', days: [], minutes: 60, goal: 'muscle' }; Sfx.play('soft'); break;
    case 'g-hday': s.days = flip(s.days, Number(v)); break;
    case 'g-hmin': s.minutes = Number(v); break;
    case 'g-hgoal': s.goal = v; break;
    case 'g-happly': {
      if (!s.preview) return;
      if (G().templates.length && !confirm('Replace your current split? Past workouts stay.')) return;
      const { habit } = L.applySplit(data, s.preview, today(), now);
      save(); gymSheet = null; Sfx.play('pop');
      toast('Split saved', `Workout habit: ${habit.freq.kind === 'daily' ? 'every day' : dayList(habit.freq.days)}`);
      break;
    }
    case 'g-tpl': {
      const p = G().templates.find(x => x.id === b.dataset.id);
      gymSheet = { kind: 'template', id: p ? p.id : 'new',
        draft: p ? { name: p.name, days: [...p.days], items: p.items.map(i => ({ name: exName(i.ex), sets: i.sets, reps: i.reps })) } : { name: '', days: [], items: [] } };
      Sfx.play('soft');
      break;
    }
    case 'g-tday': s.draft.days = flip(s.draft.days, Number(v)); break;
    case 'g-tup': case 'g-tdown': {
      const j = k + (b.dataset.act === 'g-tup' ? -1 : 1), it = s.draft.items;
      if (j < 0 || j >= it.length) return;
      [it[k], it[j]] = [it[j], it[k]];
      break;
    }
    case 'g-tdel': s.draft.items.splice(k, 1); break;
    case 'g-tadd': {
      const name = (document.querySelector('[data-g=exname]').value || '').trim();
      if (!name) return;
      s.draft.items.push({ name, sets: 3, reps: '8-12' });
      break;
    }
    case 'g-tsave': {
      const d = s.draft, name = d.name.trim();
      if (!name) { toast('Name it first', 'For example Push or Legs'); return; }
      const items = d.items.map(i => ({ ex: L.ensureExercise(data, i.name, now), sets: Math.max(1, Math.min(20, parseInt(i.sets, 10) || 3)), reps: String(i.reps || '8-12').trim() || '8-12' }));
      const g = G(), p = g.templates.find(x => x.id === s.id);
      if (p) Object.assign(p, { name, days: d.days, items, updated: now });
      else g.templates.push({ id: L.newId(), name, days: d.days, items, updated: now });
      syncWorkoutHabit(); save(); gymSheet = null; Sfx.play('pop');
      break;
    }
    case 'g-tremove':
      if (!confirm(`Delete "${s.draft.name || 'this workout'}"? Past workouts stay.`)) return;
      L.deleteGym(data, 'templates', s.id, now); syncWorkoutHabit(); save(); gymSheet = null; Sfx.play('remove');
      break;
    default:
      if (typeof gymMoreAction === 'function' && gymMoreAction(b) === false) return;
  }
  render();
}

// typing in gym sheets updates the open draft without re-rendering (keeps focus and the keyboard)
document.addEventListener('input', ev => {
  const el = ev.target, f = el.dataset && el.dataset.g;
  if (!f || !gymSheet) return;
  const k = Number(el.dataset.k);
  if (f === 'tname') gymSheet.draft.name = el.value;
  else if (f === 'tsets') gymSheet.draft.items[k].sets = el.value;
  else if (f === 'treps') gymSheet.draft.items[k].reps = el.value;
  else if (typeof gymMoreInput === 'function') gymMoreInput(el, f);
});

function render() {
  const view = document.getElementById('view');
  const board = document.querySelector('.board');
  const boardScroll = board ? board.scrollLeft : null; // keep the board where it was when the dialog opens/closes
  document.body.classList.toggle('onboarding', !!onboard);
  if (onboard) { view.innerHTML = renderOnboard(); applyMotion(); mountGoogle(); return; }
  view.innerHTML = { today: renderToday, plan: renderPlan, gym: renderGym, stats: renderStats, settings: renderSettings }[tab]()
    + (detail ? detailSheet() : review ? reviewSheet() : gymSheet ? gymSheetHtml() : ask ? askModal() : '');
  view.classList.toggle('wide', tab === 'plan');
  document.body.classList.toggle('locked', !!(editing || detail || review || gymSheet || ask));
  applyMotion();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const name = document.querySelector('#hform input[name=name]');
  if (name && !name.value && !document.querySelector('.quick')) name.focus();
  const mx = document.querySelector('.mx-wrap');
  if (mx) mx.scrollLeft = mx.scrollWidth; // newest days first in view
  const nb = document.querySelector('.board');
  if (nb) {
    if (boardScroll !== null) nb.scrollLeft = boardScroll;
    else { const tc = nb.querySelector('.col.today'); if (tc && nb.scrollWidth > nb.clientWidth) nb.scrollLeft = tc.offsetLeft - nb.offsetLeft - 16; }
  }

// ---- celebrations ----

const SMALL_MILESTONES = [3, 21];
const MESSAGES = ['That is how habits are built.', 'Consistency beats intensity.', 'Future you says thanks.',

}
// Effects (Settings, per device): 'system' = big motion follows the OS setting, small effects always on;

const calm = () => ui.motion === 'still' || (ui.motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches);

}
function nextCelebration() {

  const t = c.kind === 'tier' ? tierOf(c.n) : tierOf(c.ps);

}
function closeCelebration() {

}
function tierCard({ n, name, unit }) {

    <button class="btn primary" data-act="celclose">Keep going</button>

}
function dayCard({ ps, tierUp }) {
  const t = today();

  for (let i = 6; i >= 0; i--) {
    const k = L.addDays(t, -i);
    const st = L.isPerfect(data, k) ? 'on' : L.isPaused(data, k) ? 'pause' : 'off';
    week.push(`<div class="wd ${st}${k === t ? ' now' : ''}"><i>${st === 'on' ? CHECK : ''}</i><span>${WD[L.dow(k)].slice(0, 2)}</span></div>`);

function countUp(el) {
  const to = Number(el.dataset.to);
  if (still() || to < 2) return;
  const from = Math.max(0, to - Math.min(to, 30)), t0 = performance.now(), dur = 700;
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
let toastTimer;
function toast(title, sub = '', icon = '') {
  const el = document.getElementById('toast');
  el.innerHTML = `${icon ? `<i class="ti">${icon}</i>` : ''}<b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
// radial burst of confetti + sparks from the card's centre (skipped with reduced motion)
function burst(colors, count) {
  if (calm()) return;
  const c = document.createElement('canvas');
  c.id = 'confetti';
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  document.body.appendChild(c);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const card = document.querySelector('.cel-card');
  const r0 = card ? card.getBoundingClientRect() : { left: W / 2, top: H / 3, width: 0, height: 0 };
  const ox = r0.left + r0.width / 2, oy = r0.top + Math.min(130, r0.height / 3);
  const ps = Array.from({ length: count }, (_, i) => {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 11, spark = i % 4 === 0;
    return { x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      w: spark ? 3 : 6 + Math.random() * 6, h: spark ? 3 : 3 + Math.random() * 4, spark, c: colors[Math.random() * colors.length | 0] };
  });
  const t0 = performance.now();
  (function frame(t) {
    const p = (t - t0) / 2200;
    g.clearRect(0, 0, W, H);
    for (const q of ps) {
      q.vy += .28; q.vx *= .985; q.vy *= .985; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      g.globalAlpha = Math.max(0, 1 - p * p) * (q.spark ? .6 + Math.random() * .4 : 1);
      g.save(); g.translate(q.x, q.y); g.rotate(q.r); g.fillStyle = q.c;
      if (q.spark) { g.beginPath(); g.arc(0, 0, 1.8, 0, 7); g.fill(); } else g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      g.restore();
    }
    if (p < 1) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

// ---- sounds: synthesized with Web Audio (no files). Each tick climbs a pentatonic scale. ----
const Sfx = (() => {
  let ac;
  const ctx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, at, dur, { type = 'sine', gain = .1, to = 0 } = {}) {
    const a = ctx(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
  const S = {
    tick: n => { const f = NOTES[Math.min(Math.max(n - 1, 0), NOTES.length - 1)]; tone(f, 0, .18, { type: 'triangle', gain: .16 }); tone(f * 2, .015, .1, { gain: .035 }); },
    untick: () => tone(440, 0, .13, { gain: .07, to: 300 }),
    day: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .085, .6, { type: 'triangle', gain: .11 })); tone(2093, .36, .9, { gain: .03 }); },
    tier: () => { [261.63, 329.63, 392].forEach(f => tone(f, 0, 1.2, { type: 'triangle', gain: .06 }));
      [783.99, 987.77, 1174.66, 1567.98, 1975.53].forEach((f, i) => tone(f, .18 + i * .07, .45, { gain: .05 })); },
    pop: () => tone(880, 0, .08, { type: 'triangle', gain: .06, to: 1250 }),
    soft: () => tone(660, 0, .07, { gain: .035 }),
    pause: () => tone(392, 0, .28, { gain: .05, to: 294 }),
    remove: () => tone(330, 0, .2, { type: 'triangle', gain: .06, to: 196 }),
  };
  // a running AudioContext makes Android Chrome show an empty "OLYX" media notification — suspend it once quiet
  let idle;
  return { play(name, arg) { if (ui.sound === false) return; try { const a = ctx(); if (a.state === 'suspended') a.resume(); S[name](arg);
    clearTimeout(idle); idle = setTimeout(() => a.suspend().catch(() => {}), 2500); } catch (e) {} } };
})();

const FL_STOPS = [['#ea580c', '#f97316', '#fbbf24'], ['#c2410c', '#f97316', '#fde047'], ['#991b1b', '#ef4444', '#fb923c'], ['#1e3a8a', '#3b82f6', '#67e8f9'],
  ['#4c1d95', '#a855f7', '#f0abfc'], ['#92400e', '#f59e0b', '#fef08a'], ['#831843', '#ec4899', '#fbcfe8'], ['#6d28d9', '#ec4899', '#f59e0b', '#fef9c3']];
function drawFlame(g, n, x, y, size) {
  const t = tierOf(n);
  g.save(); g.translate(x - size / 2, y - size / 2); g.scale(size / 24, size / 24);
  const gr = g.createLinearGradient(0, 24, 0, 0);
  FL_STOPS[t].forEach((c, i, a) => gr.addColorStop(i / (a.length - 1), c));
  g.shadowColor = FL_STOPS[t][1]; g.shadowBlur = size / 12;
  g.fillStyle = gr; g.fill(new Path2D(FLAME_D));
  g.shadowBlur = 0; g.globalAlpha = .92; g.fillStyle = CORE[t]; g.fill(new Path2D(CORE_D));
  g.restore();
}
// a day as a dot on the share image (same language as the app)
function drawDot(g, k, t, x, y, r) {
  g.beginPath();
  if (k > t) { g.fillStyle = '#1d2027'; g.arc(x, y, r * .25, 0, 7); g.fill(); return; }
  if (L.isPaused(data, k)) { g.strokeStyle = '#3a404c'; g.lineWidth = 4; g.arc(x, y, r * .7, 0, 7); g.stroke(); return; }
  const s = L.dayScore(data, k);
  if (!s.total) { g.fillStyle = '#2f343e'; g.arc(x, y, r * .3, 0, 7); g.fill(); return; }
  if (s.done === s.total) {
    g.fillStyle = 'rgba(52,211,153,.18)'; g.arc(x, y, r * 1.35, 0, 7); g.fill();
    const gr = g.createLinearGradient(0, y - r, 0, y + r); gr.addColorStop(0, '#6ee7b7'); gr.addColorStop(1, '#10b981');
    g.beginPath(); g.fillStyle = gr; g.arc(x, y, r * 1.08, 0, 7); g.fill(); return;
  }
  g.fillStyle = pctColor(s.done / s.total); g.arc(x, y, r * .9, 0, 7); g.fill();
}
// share image, 1080×1920 (story). Clean: one big number, plenty of space, left-aligned type, dots.

    WD.forEach((d, i) => text(d.slice(0, 1), X + cell / 2 + i * cell, 1060, font(600, 26), '#5b6270', 'center'));
    for (let i = 0; i < n; i++) {

  + '<path d="M60.7 18.8A33 33 0 1 0 81.2 39.3" fill="none" stroke="url(#lg1)" stroke-width="9.7" stroke-linecap="round"/><circle cx="73.3" cy="26.7" r="7" fill="#ecfdf5"/></svg>';
let onboard = null; // { step, picked: ['pack:item', ...] }
function renderOnboard() {
  if (onboard.step === 0) return `<div class="ob ob0">
    ${LOGO}<h1>OLYX</h1><p>Build habits that stick.<br>One day at a time.</p>

}
function finishOnboarding() {
  const t = today();
  onboard = null; ui.onboarded = true; saveUi(); save();

// ---- daily reminder: Web Push from a tiny Cloudflare Worker (olyx-reminders) ----
const PUSH_API = 'https://olyx-reminders.mmartis-99d.workers.dev'; // worker code: C:\Users\mmart\olyx-reminders
const VAPID_PUBLIC = 'BIkGEm4pxuy3W9NC7wtmgOSD6sgFsAYZ5SW4PsWu9qGJBFi0OuX6SvdUWa0E5l4rVMY5cPhn4ybw54kKGdexX6M';
const canPush = () => !!PUSH_API && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const canRemind = () => NATIVE || canPush(); // the app schedules reminders on the device; the web uses Web Push
let remStatus = '';
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
// Reminders are automatic: 9:00, 18:00 and 21:00 local time, only while something is left that day.
// uid groups this user's devices (from the account when signed in), so finishing the day on one device
// silences the rest of today's reminders everywhere. The server only ever learns "day X is done".
const REMIND_TIMES = '9:00, 18:00 and 21:00';
async function userId() {
  const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  if (sync && sync.uid) return sync.uid; // same id on all devices of the account (from the server)
  if (!ui.uid) { ui.uid = hex(crypto.getRandomValues(new Uint8Array(12))); saveUi(); }
  return ui.uid;
}
// quiet = refresh on app start (time zone, uid after sync changes); no UI
// ---- Android app: reminders scheduled on the phone (no server push). Every save/sync re-plans the next 7 days,
// so finishing today cancels the rest of today. Ticks on another device show up after the app opens and syncs.
const LN = () => Capacitor.Plugins.LocalNotifications;
var localTimer; // var, not let: snapshot() can run during start-up before this line
function scheduleLocal() { if (!NATIVE) return; clearTimeout(localTimer); localTimer = setTimeout(scheduleLocalNow, 1000); }
async function scheduleLocalNow() {
  clearTimeout(localTimer); localTimer = null;
  try {
    const pending = (await LN().getPending()).notifications || [];
    if (pending.length) await LN().cancel({ notifications: pending.map(n => ({ id: n.id })) });
    if (!(ui.reminder && ui.reminder.on)) return;
    await LN().createChannel({ id: 'reminders', name: 'Daily reminders', description: `${REMIND_TIMES}, only while something is left`, importance: 4 });
    await LN().schedule({ notifications: L.reminderPlan(data, new Date()).map(p => ({
      // isExactNotification false: otherwise the plugin opens Android's "Alarms & reminders" settings (no exact-alarm permission on purpose)
      id: p.id, title: p.title, body: p.body, channelId: 'reminders', isExactNotification: false, schedule: { at: p.at, allowWhileIdle: true } })) });
  } catch (e) {} // next save tries again
}
async function enableReminderNative(quiet) {
  try {
    let p = (await LN().checkPermissions()).display;
    if (p !== 'granted' && !quiet) p = (await LN().requestPermissions()).display; // Android's own "Allow OLYX to send notifications?"
    if (p !== 'granted') {
      if (quiet) { ui.reminder = { on: false }; saveUi(); scheduleLocal(); return; }
      remStatus = 'Notifications are blocked — allow them for OLYX in your phone settings (Apps → OLYX → Notifications).';
      toast('Notifications not on', remStatus); render(); return;
    }
    ui.reminder = { on: true }; ui.doneSent = undefined; saveUi(); scheduleLocal();
    if (quiet) return;
    remStatus = '';
    toast('Notifications on', `${REMIND_TIMES} — only while something is left`);
  } catch (e) { if (quiet) return; remStatus = 'Could not turn on notifications: ' + e.message; toast('Notifications not on', e.message); }
  render();
}
async function enableReminder(quiet = false) {
  if (NATIVE) return enableReminderNative(quiet);
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    // a live push subscription is the real answer: Samsung Internet keeps reporting permission 'default'
    // after the user allowed it (browsers drop the subscription when the permission is taken away)
    if (!sub && Notification.permission !== 'granted') {
      const p = quiet ? '' : await Notification.requestPermission();
      if (p !== 'granted') {
        if (!quiet) {
          // shown on Today too: the pill there gave no feedback before
          remStatus = p === 'denied' ? 'Notifications are blocked — allow them for OLYX in your phone settings (Apps → OLYX → Notifications).'
            : 'Notifications were not allowed. Tap again and choose Allow.';
          toast('Notifications not on', remStatus); render();
        }
        else { ui.reminder = { on: false }; saveUi(); }
        return;
      }
    }
    sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const r = await fetch(PUSH_API + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, uid: await userId() }) });
    if (!r.ok) throw new Error('server said ' + r.status);
    ui.reminder = { on: true }; ui.doneSent = undefined; saveUi(); snapshot();
    if (quiet) return;
    remStatus = '';
    toast('Notifications on', `${REMIND_TIMES} — only while something is left`);
  } catch (e) { if (quiet) return; remStatus = 'Could not turn on notifications: ' + e.message; toast('Notifications not on', e.message); }
  render();
}
// tell the server when today becomes complete (or not any more) — only on change
let doneTimer;
function reportDone() {
  if (!canRemind() || !ui.reminder || !ui.reminder.on) return;
  clearTimeout(doneTimer);
  doneTimer = setTimeout(async () => {
    const t = today(), day = L.isPerfect(data, t) ? t : null;
    if (ui.doneSent === day) return;
    try {
      const r = await fetch(PUSH_API + '/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: await userId(), day }) });
      if (r.ok) { ui.doneSent = day; saveUi(); }
    } catch (e) {} // offline: tried again on the next change / open
  }, 800);
}
// install as an app (Android Chrome / desktop Chrome & Edge)
let installEvt = null;
const standalone = () => NATIVE || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true || document.documentElement.classList.contains('twa');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!editing && !detail && !review) { pickAsk(); render(); } });
addEventListener('appinstalled', () => { installEvt = null; toast('OLYX installed', 'Open it from your home screen'); safeRender(); });
async function installApp() {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null;
  render();
}
// ---- start-up windows: notifications, then install. Must be answered (X or confirm); X leaves a pill on Today ----
const BELL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg>';
const DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';
// 'on' = subscribed (checked against the browser's push subscription on every start). Not "=== 'granted'":
// Samsung Internet reports 'default' even after the user allowed notifications
const notifyOn = () => !!(ui.reminder && ui.reminder.on) && (NATIVE || Notification.permission !== 'denied');
const wantsNotify = () => canRemind() && !notifyOn() && (NATIVE || Notification.permission !== 'denied'); // the app has no web Notification API
// install is offered whenever OLYX runs in a browser tab; without Chrome's prompt the window shows how to do it by hand
const wantsInstall = () => !standalone();
let ask = null; // 'notify' | 'install'
function pickAsk() {
  if (ask || onboard) return;
  if (wantsNotify() && !ui.notifyNo) ask = 'notify';
  else if (wantsInstall() && !ui.installNo) ask = 'install';
}
// a home-screen *shortcut* (not a real install) shows Chrome's "Tap to copy the URL for this app" notification while open
const INSTALL_STEPS = 'In Chrome tap <b>⋮</b> → <b>Install app</b>. If you only see <b>Add to Home screen</b>, tap it and choose <b>Install</b>, not "Create shortcut".';
function askModal() {
  const notify = ask === 'notify';
  return `<div class="backdrop"></div>
    <div class="sheet amodal" role="dialog" aria-modal="true" aria-label="${notify ? 'Notifications' : 'Install OLYX'}">
      <button class="x" data-act="ask-x" aria-label="Close">×</button>
      <div class="am-ico">${notify ? BELL : LOGO}</div>
      <h3>${notify ? 'Never miss a day' : 'Install OLYX'}</h3>
      <p>${notify ? 'So nothing slips through the cracks.' : installEvt ? 'Open OLYX from your home screen like any other app.'
        : INSTALL_STEPS}</p>
      <button class="btn primary" data-act="ask-yes">${notify ? 'Turn on notifications' : installEvt ? 'Install' : 'Got it'}</button>
    </div>`;
}

async function disableReminder() {
  if (NATIVE) { ui.reminder = { on: false }; saveUi(); await scheduleLocalNow(); remStatus = 'Notifications off.'; return render(); }
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub) {
      await fetch(PUSH_API + '/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {});
      await sub.unsubscribe();
    }
  } catch (e) {}
  ui.reminder = { on: false }; saveUi();
  remStatus = 'Notifications off.';
  render();
}

function move(id, dir) {
  const idx = data.habits.findIndex(h => h.id === id);
  let j = idx + dir;
  while (j >= 0 && j < data.habits.length && data.habits[j].archived) j += dir; // skip archived
  if (j < 0 || j >= data.habits.length) return;
  [data.habits[idx], data.habits[j]] = [data.habits[j], data.habits[idx]];
  data.habits[idx].updated = data.habits[j].updated = Date.now(); // so the new order wins on sync
}

// Android app: WebViews can't download or use navigator.share → write to the app cache and open Android's share sheet.
// Returns false on the web, where the caller keeps its browser path.
async function shareFile(name, blob, title) {
  if (!NATIVE) return false;
  const data64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
  try {
    const { uri } = await Capacitor.Plugins.Filesystem.writeFile({ path: name, data: data64, directory: 'CACHE' });
    await Capacitor.Plugins.Share.share({ title, files: [uri] });
  } catch (e) { if (!/cancel/i.test(e && e.message || '')) toast('Could not share', (e && e.message) || String(e)); }
  return true;
}

async function exportData() {
  data.lastExport = today();
  save();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), name = `olyx-backup-${today()}.json`;
  if (await shareFile(name, blob, 'OLYX backup')) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', ev => {
  if (!ev.target.closest('#tip, .dt')) hideTip();
  const b = ev.target.closest('button, .backdrop, .cel-bg');
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; editing = detail = review = gymSheet = null; if (tab === 'today') viewDay = today(); return render(); }
  const id = b.dataset.id;
  if ((b.dataset.act || '').startsWith('g-')) return gymAction(b); // Gym tab
  const h = data.habits.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'prev': viewDay = L.addDays(viewDay, -1); break;
    case 'next': if (viewDay < today()) viewDay = L.addDays(viewDay, 1); break;
    case 'toggle': {
      const t = today();
      const before = L.dayScore(data, viewDay), streakBefore = L.streak(data, h, t);
      L.toggle(data, id, viewDay);
      save();
      const after = L.dayScore(data, viewDay), streakAfter = L.streak(data, h, t);
      const unit = h.freq.kind === 'weekly' ? 'week' : 'day';
      if (L.isDone(data, id, viewDay)) { lit = id; Sfx.play('tick', (data.log[viewDay] || []).length); } else Sfx.play('untick');
      celebrate = !L.isPaused(data, viewDay) && after.total > 0 && after.done === after.total && before.done !== before.total;
      if (streakAfter > streakBefore && streakAfter >= 7 && TIERS.some(x => x.at === streakAfter) && once(`tier|${id}|${streakAfter}`)) {
        queue.push({ kind: 'tier', n: streakAfter, name: h.name, unit });
      } else if (streakAfter > streakBefore && SMALL_MILESTONES.includes(streakAfter) && once(`small|${id}|${streakAfter}`)) {
        toast(`${streakAfter}-${unit} streak`, `${h.name} — keep it going`);
      }
      if (celebrate && viewDay === t && once('day')) {
        const ps = L.perfectStreak(data, t);
        queue.push({ kind: 'day', ps, tierUp: ps >= 7 && TIERS.some(x => x.at === ps) });
      }
      if (navigator.vibrate && !queue.length) navigator.vibrate(8);
      break;
    }
    case 'celclose': closeCelebration(); return;
    case 'delete': if (h && confirm(`Delete "${h.name}" permanently?\n\nIts whole history will be removed, also on your other synced devices. This can't be undone.`)) {
      L.deleteHabit(data, id); save(); Sfx.play('remove');
    } break;
    case 'pday': if (h) {
      const d = Number(b.dataset.d), cur = h.freq.kind === 'daily' ? [0, 1, 2, 3, 4, 5, 6] : h.freq.days;
      const days = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d].sort();
      if (!days.length) { toast('At least one day', 'To stop a habit, archive it in Edit'); return; }
      h.freq = days.length === 7 ? { kind: 'daily' } : { kind: 'days', days };
      h.updated = Date.now(); save(); Sfx.play(cur.includes(d) ? 'soft' : 'pop');
    } break;
    case 'addday': if (h && typeof addCol === 'number') {
      const days = [...h.freq.days, addCol].sort();
      h.freq = days.length === 7 ? { kind: 'daily' } : { kind: 'days', days };
      h.updated = Date.now(); editing = null; save(); Sfx.play('pop');
    } break;
    // onboarding
    case 'ob-next': finishOnboarding(); pickAsk(); break;
    case 'suggest': { const [name, note, f] = SUGGEST[Number(b.dataset.i)];
      data.habits.push({ id: L.newId(), name, note, type: 'check', freq: f || { kind: 'daily' }, created: today(), archived: false, updated: Date.now() });
      save(); Sfx.play('pop'); toast('Added', name); break; }
    case 'install': installApp(); return;
    case 'gnative': nativeGoogle(); return;
    case 'ask-x': dismissAsk(); break;
    case 'ask-yes': { const was = ask; ask = null; if (was === 'notify') { ui.notifyNo = true; saveUi(); enableReminder().then(() => { pickAsk(); render(); }); } else { ui.installNo = true; saveUi(); installApp(); } break; }
    case 'ask-notify': enableReminder(); return;
    case 'install-ask': if (installEvt) { installApp(); return; } ask = 'install'; break;
    case 'setrem': if (b.dataset.v === 'on') enableReminder(); else disableReminder(); return;
    // sound & effects
    case 'setsound': ui.sound = b.dataset.v === 'on'; saveUi(); Sfx.play('pop'); break;
    case 'setmotion': ui.motion = b.dataset.v; saveUi(); break;
    // habit history
    case 'detail': editing = null; detail = { id, ym: today().slice(0, 7) }; Sfx.play('soft'); break;
    case 'dclose': detail = null; break;
    case 'dmonth': detail.ym = shiftMonth(detail.ym, Number(b.dataset.v)); break;
    case 'dtoggle': {
      const k = b.dataset.day;
      L.toggle(data, detail.id, k); save();
      Sfx.play(L.isDone(data, detail.id, k) ? 'tick' : 'untick', 3);
      break;
    }
    // monthly review + sharing
    case 'mreview': review = { ym: today().slice(0, 7) }; Sfx.play('soft'); break;
    case 'rclose': review = null; break;
    case 'rmonth': review.ym = shiftMonth(review.ym, Number(b.dataset.v)); break;
    case 'share': shareImage(b.dataset.v); return;
    case 'review': ui.reviewed = L.addDays(today(), -1); saveUi(); viewDay = ui.reviewed; break;
    case 'dismiss': ui.reviewed = L.addDays(today(), -1); saveUi(); break;
    case 'range': range = Number(b.dataset.n); break;
    case 'open': viewDay = b.dataset.day; tab = 'today'; review = null; hideTip(); break;
    case 'dot': // desktop: open the day; phone: first tap shows the summary
      if (canHover) { viewDay = b.dataset.day; tab = 'today'; review = null; hideTip(); break; }
      if (tipDay === b.dataset.day) hideTip(); else showTip(b);
      return;
    case 'pause': L.togglePause(data, viewDay); save(); Sfx.play('pause'); break;
    case 'new': editing = 'new'; addCol = /^\d$/.test(b.dataset.col) ? Number(b.dataset.col) : b.dataset.col; break;
    case 'edit': editing = id; break;
    case 'cancel': editing = null; break;
    case 'up': move(id, -1); save(); break;
    case 'down': move(id, 1); save(); break;
    case 'archive': if (h) { h.archived = !h.archived; h.updated = Date.now(); if (editing === id) editing = null; save(); Sfx.play('soft'); } break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); return;
    case 'syncnow': syncStatus = 'Syncing…'; syncNow(); break;
    case 'signout':
      if (!confirm('Sign out on this device? Your habits stay here.')) return;
      api('/account/signout').catch(() => {}).finally(() => { signedOut(); syncStatus = ''; render(); }); return;
    case 'delacct':
      if (!confirm('Delete your habits from the OLYX server and sign out everywhere? This device keeps its copy. This cannot be undone.')) return;
      api('/account/delete').then(() => { signedOut(); syncStatus = ''; toast('Account data deleted', 'This device keeps its copy'); render(); }, e => alert('Could not delete: ' + e.message)); return;
    default: return;
  }
  render();
  nextCelebration();
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const name = String(f.get('name')).trim();
  if (!name) return;
  const fv = String(f.get('freq'));
  let freq = fv === 'daily' ? { kind: 'daily' } : fv === 'days' ? { kind: 'days', days: f.getAll('day').map(Number).sort() } : { kind: 'weekly', times: Number(fv.slice(1)) };
  if (freq.kind === 'days' && !freq.days.length) return alert('Pick at least one day.');
  if (freq.kind === 'days' && freq.days.length === 7) freq = { kind: 'daily' };
  const note = String(f.get('note')).trim();
  const updated = Date.now();
  if (editing === 'new') data.habits.push({ id: L.newId(), name, note, type: 'check', freq, created: today(), archived: false, updated });
  else Object.assign(data.habits.find(h => h.id === editing), { name, note, freq, updated });
  Sfx.play(editing === 'new' ? 'pop' : 'soft');
  editing = null;
  save();
  render();
  nextCelebration();
});

// X on a start-up window (also Android back): remember the answer, a pill stays on Today
function dismissAsk() { if (ask === 'notify') ui.notifyNo = true; else ui.installNo = true; saveUi(); ask = null; pickAsk(); }
// Android back: close what's on top first; from Today with nothing open, leave the app
if (NATIVE) Capacitor.Plugins.App.addListener('backButton', () => {
  hideTip();
  if (document.querySelector('.cel')) return closeCelebration();
  if (ask) dismissAsk();
  else if (editing || detail || review || gymSheet) editing = detail = review = gymSheet = null;
  else if (tab !== 'today') { tab = 'today'; viewDay = today(); }
  else return Capacitor.Plugins.App.exitApp();
  render();
});

document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.querySelector('.cel')) closeCelebration();
  else if (editing || detail || review || gymSheet) { editing = detail = review = gymSheet = null; render(); }
});

// show weekday chips only for "Specific days"
document.addEventListener('change', ev => {
  if (ev.target.name === 'freq') ev.target.form.dataset.kind = ev.target.value === 'days' ? 'days' : '';
});

document.getElementById('importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { return alert('That file is not valid JSON.'); }
  if (!L.validate(obj)) return alert('That file is not an OLYX backup. Nothing was changed.');
  const days = Object.keys(obj.log).length;
  if (!confirm(`Replace all current data with this backup (${obj.habits.length} habits, ${days} logged days)?`)) return;
  data = obj;
  save();
  render();
});

// "today" moves at 04:00 even if the app stayed open
// leaving the app: push pending changes now. Coming back: pull what the other device did.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (syncTimer) syncNow(); return; }
  const t = today();
  if (t !== lastToday) { if (viewDay === lastToday) viewDay = t; lastToday = t; }
  safeRender();
  syncNow();
});
window.addEventListener('online', () => syncNow());

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { persisted = ok; if (tab === 'settings') render(); });
if ('serviceWorker' in navigator && !NATIVE) { // the app ships its files inside; updates come as new app versions
  navigator.serviceWorker.register('sw.js');
  // new version just installed → reload once so it shows now, not on the next open (only right after opening, never mid-edit)
  const hadSw = !!navigator.serviceWorker.controller, openedAt = Date.now();
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSw && Date.now() - openedAt < 8000 && !editing) location.reload(); });
}

// notifications window right away; install waits a moment for Chrome's own install prompt
if (wantsNotify() && !ui.notifyNo) pickAsk(); else setTimeout(() => { if (!ask && !editing && !detail && !review) { pickAsk(); render(); } }, 2500);
// keep the reminder registration fresh (time zone, server record) every time the app opens
if (canRemind() && ui.reminder && ui.reminder.on) enableReminder(true).then(reportDone);
// onboarding until it was finished once (also if the app was closed halfway through)
if (!ui.onboarded && !data.habits.length && !Object.keys(data.log).length) onboard = { step: 0, picked: [] };
// first days of a new month: show last month's review once
{
  const t = today(), prev = shiftMonth(t.slice(0, 7), -1), s = L.monthStats(data, prev, t);
  if (Number(t.slice(8)) <= 7 && ui.lastReview !== prev && s && s.checkins) { review = { ym: prev }; ui.lastReview = prev; saveUi(); }
}
render();
setTimeout(() => document.getElementById('splash').remove(), still() ? 0 : 1600);
syncNow();
